name: Release

# Deploys are handled by Vercel's Git integration (production migrations run in its
# build, see scripts/vercel-build.js). This workflow only does versioning: when changesets
# land on main, it opens or updates a "Version Packages" pull request. Merging that PR
# bumps the version and updates CHANGELOG.md. A PR is required because main only accepts
# changes through pull requests.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create or update the Version Packages PR
        uses: changesets/action@v1
        with:
          version: npm run version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
