name: Version

# Vercel deploys every push to main, so each PR carries its own version bump and
# changelog entry. Merging a PR then deploys code, version and changelog together.
#
# - Every push to a PR: version that PR branch (scripts/version-pr.sh adds or refreshes
#   a single "chore: version packages [bot]" commit when the PR has changesets).
# - Every push to main: re-version the other open PRs on top of the new main, so they
#   never carry a stale version or conflict on package.json / CHANGELOG.md.
#
# Commits pushed with GITHUB_TOKEN don't trigger workflows, so this can't loop. It also
# means the bot's commit itself shows no CI checks; the commit before it does.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: versioning
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token; only same-repository branches can be versioned.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version this pull request
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: scripts/version-pr.sh "$HEAD_REF"

      - name: Re-version open pull requests
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          for branch in $(gh pr list --base main --state open --limit 100 \
              --json headRefName,isCrossRepository \
              --jq '.[] | select(.isCrossRepository | not) | .headRefName'); do
            scripts/version-pr.sh "$branch" || failed=1
          done
          exit "$failed"
